<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Local AI Bridge — Your AI tools. One team.</title>
  <desc id="desc">A local coordinator connects scoped Codex and Claude Code workers and an optional Notion board. Windows reference release using your own subscriptions.</desc>
